<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Módulo Front-End</title>
    <!-- Importación de Bootstrap CSS para diseño responsivo y profesional -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Contenedor principal de la interfaz -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                
                <!-- Encabezado del módulo -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body text-center bg-primary text-white rounded">
                        <h2 class="fw-bold">Módulo Front-End del Proyecto</h2>
                        <p class="mb-0">Evidencia GA7-220501096-AA4-EV03 - Interfaz de Usuario</p>
                    </div>
                </div>

                <!-- Formulario para Inserción de Datos -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Registrar Nuevo Usuario</h5>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo:</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico:</label>
                                <input type="email" class="form-control" id="correo" name="correo" placeholder="Ej. juan@correo.com" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Usuario</button>
                        </form>
                    </div>
                </div>

                <!-- Tabla de Visualización de Datos -->
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Lista de Usuarios Registrados</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Correo</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td>Ana María Gómez</td>
                                    <td>ana.gomez@sena.edu.co</td>
                                    <td>
                                        <button class="btn btn-sm btn-warning">Editar</button>
                                        <button class="btn btn-sm btn-danger">Eliminar</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Importación de Bootstrap JS para interactividad -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
